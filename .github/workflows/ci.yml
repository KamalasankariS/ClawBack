name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-lint:
    name: Server Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && npx prisma generate
      - run: cd server && npx tsc --noEmit --skipLibCheck

  client-lint:
    name: Client Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd client && npx tsc -b
      - run: cd client && npm run lint

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    needs: client-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd client && npm run build

  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: server-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clawback
          POSTGRES_PASSWORD: clawback
          POSTGRES_DB: clawback
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://clawback:clawback@localhost:5433/clawback?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && npx prisma migrate deploy
      - run: cd server && npx tsx src/seed/seed.ts
      - run: cd server && npm test
